name: Deploy Docs

on:
  push:
    tags:
      - 'docs-v*.*.*' # docs only  → e.g. docs-v1.2.0
      - 'all-v*.*.*'  # combined   → e.g. all-v1.2.0  (also triggers publish.yml)

permissions:
  contents: read

jobs:
  # ─── Job 1: Build ────────────────────────────────────────────────────────────
  build-docs:
    name: Build Docs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      # Build packages first — docs app depends on them via workspace links
      - name: Build packages
        run: npx nx run-many --target=build --projects=tokens,styles,core,angular

      # Build the docs Angular app in production mode
      - name: Build docs (production)
        run: npx ng build docs --configuration=production

      # Pass the compiled output to the deploy job
      - name: Upload docs artifact
        uses: actions/upload-artifact@v4
        with:
          name: docs-dist
          path: dist/docs/browser
          retention-days: 1

  # ─── Job 2: Deploy ───────────────────────────────────────────────────────────
  deploy-docs:
    name: Deploy Docs to Vercel
    runs-on: ubuntu-latest
    needs: build-docs # only runs if build-docs succeeds

    steps:
      - name: Download docs artifact
        uses: actions/download-artifact@v4
        with:
          name: docs-dist
          path: dist/docs/browser

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      # Ensure vercel.json is present in dist/docs/browser so Vercel configures SPA rewrites
      - name: Ensure vercel.json for SPA routing
        run: |
          cat << 'EOF' > dist/docs/browser/vercel.json
          {
            "rewrites": [
              { "source": "/(.*)", "destination": "/index.html" }
            ]
          }
          EOF

      # Tag push → deploy directly to Vercel production
      - name: Deploy to Vercel (production)
        run: |
          vercel deploy ./dist/docs/browser \
            --token=${{ secrets.VERCEL_TOKEN }} \
            --scope=${{ secrets.VERCEL_ORG_ID }} \
            --prod \
            --yes
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
