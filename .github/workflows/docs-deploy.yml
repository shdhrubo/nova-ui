name: Deploy Docs

on:
  push:
    tags:
      - 'v*.*.*' # triggers on tags like v1.0.0, v2.1.3, etc.

permissions:
  contents: read

jobs:
  deploy-docs:
    name: Build & Deploy Docs to Vercel
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Build packages first — docs app depends on them via workspace links
      - name: Build packages
        run: npx nx run-many --target=build --projects=tokens,styles,core,angular

      # Build the docs Angular app in production mode
      # Output goes to dist/docs (configured in angular.json)
      - name: Build docs (production)
        run: npx ng build docs --configuration=production

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      # Tag push → deploy directly to Vercel production
      - name: Deploy to Vercel (production)
        run: |
          vercel deploy ./dist/docs \
            --token=${{ secrets.VERCEL_TOKEN }} \
            --scope=${{ secrets.VERCEL_ORG_ID }} \
            --prod \
            --yes
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
