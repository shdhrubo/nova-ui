name: Publish Packages

on:
  push:
    tags:
      - 'pkg-v*.*.*' # packages only → e.g. pkg-v1.2.0
      - 'all-v*.*.*' # combined       → e.g. all-v1.2.0  (also triggers docs-deploy.yml)

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write # to create GitHub Releases

jobs:
  # ─── Job 1: Build ────────────────────────────────────────────────────────────
  build-packages:
    name: Build Packages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history so changesets can diff across commits
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          # Scope the auth to npmjs registry for publishing
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      # Build all 4 packages in correct dependency order:
      # tokens → styles → core → angular
      - name: Build packages
        run: npx nx run-many --target=build --projects=tokens,styles,core,angular

      # Pass the compiled output to the publish job
      - name: Upload packages artifact
        uses: actions/upload-artifact@v4
        with:
          name: packages-dist
          path: |
            packages/tokens/dist
            packages/styles/dist
            packages/core/dist
            packages/angular/dist
          retention-days: 1

  # ─── Job 2: Publish ──────────────────────────────────────────────────────────
  publish-packages:
    name: Publish to npm & Create Release
    runs-on: ubuntu-latest
    needs: build-packages # only runs if build-packages succeeds

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Download packages artifact
        uses: actions/download-artifact@v4
        with:
          name: packages-dist

      # Publish all 4 packages to npm
      - name: Publish to npm
        run: node scripts/publish-all.js
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Create a GitHub Release for the tag so it appears on the Releases page
      - name: Create GitHub Release
        uses: actions/github-script@v7
        with:
          script: |
            const tag = context.ref.replace('refs/tags/', '');
            await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              name: `Release ${tag}`,
              body: `## Nova UI ${tag}\n\nPublished packages:\n- \`@nova-ui-library/tokens\`\n- \`@nova-ui-library/styles\`\n- \`@nova-ui-library/core\`\n- \`@nova-ui-library/angular\``,
              draft: false,
              prerelease: tag.includes('-'),
            });
